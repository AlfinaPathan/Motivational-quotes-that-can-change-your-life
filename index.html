<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivational Quotes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    text-align: center;
}

/* 🌟 Welcome Section */
.welcome {
    position: relative;
}

.welcome img {
    width: 100%;
    height: auto;
}

/* Welcome text on image */
.welcome::after {
    content: "Welcome to Motivational Quotes";
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 2em;
    font-weight: bold;
    text-shadow: 2px 2px 10px black;
}

/* Header */
header {
    padding: 40px;
    background: linear-gradient(45deg, #1a1a1a, #333);
}

h1 {
    font-size: 2.2em;
}

p {
    font-size: 1em;
    color: #ccc;
}

/* Quotes */
.container {
    padding: 20px;
}

.quote {
    background: #1c1c1c;
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    width: 85%;
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
    font-size: 1.1em;
}

.quote img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* Footer */
footer {
    margin-top: 30px;
    padding: 15px;
    background: #111;
    color: #aaa;
}
</style>
</head>

<body>

<!-- 🌟 WELCOME IMAGE -->
<div class="welcome">
    <img src="quote.jpeg" alt="Welcome Image">
</div>

<header>
    <h1>Stay Inspired Every Day ✨</h1>
    <p>Start your day with positivity and purpose</p>
</header>

<div class="container">

<>
<div class="quote">
    <img src="quote1.jpg" alt="Quote 1 Image">
    
    <!-- ✍️ FIRST QUOTE HERE -->
    Your first motivational quote ✨
    <br><br>
    Urdu translation here
</div>

<!-- 🖼️ QUOTE 2 -->
<div class="quote">
    <img src="quote2.jpg" alt="Quote 2 Image">
    
    <!-- ✍️ SECOND QUOTE HERE -->
    Your second motivational quote 💫
    <br><br>
    Urdu translation here
</div>

</div>

<footer>
    <p>Motivation • Growth • Positivity</p>
</footer>

</body>
</html>
